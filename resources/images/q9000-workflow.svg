<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">ManifoldTech Workflow: Mapping, Navigation &amp; Simulation</title><desc id="diagram-desc">Q9000 and Odin1 are alternative mapping sources, shown with an or label and symmetric horizontal arrows. MindCloud processes the Q9000 .lx project or the Odin1 .bin recording export into three output branches: The upper branch sends 3DGS to a live dashboard with bidirectional ONS2 interaction; the middle branch sends .pcd and .bin files to the pcd to pgm module inside ONS2; the lower branch sends 3DGS and Mesh to MT-Real2Sim-Tutorial to provide simulation scenes for ONS2 deployment and validation via a straight horizontal arrow. All arrowed connections are horizontal.</desc><defs><marker id="arrow-64748B" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748B"/></marker><marker id="arrow-2563EB" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2563EB"/></marker><marker id="arrow-0D9488" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#0D9488"/></marker><marker id="arrow-7C3AED" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#7C3AED"/></marker></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
